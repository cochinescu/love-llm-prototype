[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lovellm-prototype"
version = "1.2.0"
description = "Reference implementation of an artificial-partiality mechanism and its synthetic and open-weight-model evaluation grids"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.1", "matplotlib==3.11.0"]

[project.optional-dependencies]
real = ["mlx==0.32.0; platform_system == 'Darwin'", "mlx-lm==0.31.3; platform_system == 'Darwin'"]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["lovellm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
